# --- TMUX CONFIG ----------------------------------------------------------
# After making changes run: tmux source-file ~/.tmux.conf

# Plugins
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Window tabs
# Start new sessions at window 1; close gaps when windows are removed.
set -g base-index 1
set -g renumber-windows on
set -g status on
set -g status-position top
set -g status-justify left
# Match Ghostty's background and VS Code palette.
set -g status-style 'bg=#1f1f1f,fg=#d4d4d4'
set -g status-left ' #S '
set -g status-left-length 30
# set -g status-right ' %H:%M '
set -g status-right "#{?client_prefix,PREFIX ,}#(whoami)@#h | %Y-%m-%d %H:%M"
set -g window-status-separator ''
# Show names only, without numbers, colons, or flags.
set -g window-status-format ' #W '
set -g window-status-current-format ' #W '
set -g window-status-style 'bg=#{?#{==:#{window_index},1},##A83232,#{?#{==:#{window_index},2},##8F5F45,#{?#{==:#{window_index},3},##858552,#{?#{==:#{window_index},4},##425F35,#{?#{==:#{window_index},5},##264F78,#{?#{==:#{window_index},6},##80547C,##454545}}}}}},fg=#ffffff'
set -g window-status-current-style 'bg=#{?#{==:#{window_index},1},##F44747,#{?#{==:#{window_index},2},##CE9178,#{?#{==:#{window_index},3},##DCDCAA,#{?#{==:#{window_index},4},##6A9955,#{?#{==:#{window_index},5},##569CD6,#{?#{==:#{window_index},6},##C586C0,##808080}}}}}},fg=#1f1f1f,bold'
set -g window-status-activity-style 'bold'

# Panes and navigation
set -g mouse on
set -g history-limit 50000
set -g focus-events on
set -sg escape-time 10
set -g pane-border-status top
set -g pane-border-format ' #{pane_index}: #{pane_current_command} '
set -g pane-border-style 'fg=#454545'
set -g pane-active-border-style 'fg=#007acc'

# Initialize TMUX plugin manager (keep this at the very bottom)
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
run '~/.tmux/plugins/tpm/tpm'
